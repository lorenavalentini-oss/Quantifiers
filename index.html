<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English File · Unit 9 Grammar & Practice</title><style>:root{--ink:#24364a;--muted:#64748b;--line:#dce5ef;--blue:#eaf4ff;--green:#eaf8f0;--purple:#f3edff;--bg:#f7f9fc;--accent:#3568c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:990px;margin:auto;padding:28px 18px 70px}header{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 30px;margin-bottom:20px}h1{font-size:clamp(26px,4vw,38px);margin:0 0 5px}header p{margin:0;color:var(--muted)}nav{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}nav a{background:white;border:1px solid var(--line);padding:9px 16px;border-radius:30px;text-decoration:none;color:var(--ink);font-weight:700}.unit{background:white;border:1px solid var(--line);border-radius:20px;margin:22px 0;overflow:hidden;box-shadow:0 5px 18px #1c33510a}.unit-head{padding:22px 26px}.unit-head h2{margin:0;font-size:25px}.unit-head p{margin:3px 0 0}.u9a .unit-head{background:var(--blue)}.u9b .unit-head{background:var(--green)}.u9c .unit-head{background:var(--purple)}.inner{padding:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:13px;padding:16px;background:#fff}.card h3{font-size:18px;margin:0 0 7px}.card p{margin:6px 0}.eg{color:#295f9c;font-weight:650}.tip{background:#fff9e9;border-left:4px solid #f0bb52;padding:12px 15px;border-radius:9px;margin:15px 0}.practice{margin-top:24px;border-top:2px dashed var(--line);padding-top:17px}.practice h3{font-size:21px;margin:0 0 8px}.task{background:#f9fbfd;border:1px solid var(--line);padding:16px 18px;border-radius:13px;margin:13px 0}.task h4{margin:0 0 9px;font-size:17px}.question{padding:12px 0;border-bottom:1px solid #e8eef5}.question:last-child{border:0}.question label{display:block;margin-bottom:7px}.question select{width:min(100%,320px);padding:10px 12px;border:1px solid #b9c9da;border-radius:9px;background:white;color:var(--ink);font-size:15px}.question.correct select{border-color:#2b9b6e;background:#effbf4}.question.incorrect select{border-color:#d76d70;background:#fff5f5}.feedback{font-size:13px;margin-top:5px;font-weight:650}.correct .feedback{color:#168455}.incorrect .feedback{color:#b64049}.example{color:var(--muted);font-size:14px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.btn{background:#3465bd;border:0;color:white;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:750}.btn.secondary{background:#edf2f9;color:#274466}.score{font-weight:750;color:#275b9d}.note{font-size:13px;color:var(--muted)}@media(max-width:550px){.inner{padding:16px}.unit-head{padding:18px}.wrap{padding:14px 10px 50px}}@media print{body{background:white}.unit{break-inside:avoid;box-shadow:none}nav,.buttons{display:none}} .u9d .unit-head{background:#fff1df}.u9e .unit-head{background:#e7f7f7}.mini-table{width:100%;border-collapse:collapse;margin:12px 0}.mini-table th,.mini-table td{border:1px solid #dce5ef;padding:10px;text-align:left}.mini-table th{background:#f2f6fc}

</style></head><body><main class="wrap"><header><h1>English File · Unit 9</h1><p>Grammar made simple · Read the cards, then practise below.</p></header><nav><a href="#a">9A · Food words</a><a href="#b">9B · Quantities</a><a href="#c">9C · Comparatives</a><a href="#d">9D · As…as</a><a href="#e">9E · Superlatives</a></nav><div id="content"></div></main><script>
const units=[{id:'a',title:'9A · A, AN, SOME & ANY',sub:'Talking about food and drinks',cards:[['A / AN','One countable thing.','a sandwich · an egg','Use <b>a</b> before a consonant sound and <b>an</b> before a vowel sound.'],['SOME','A quantity we don’t specify.','some apples · some milk','Usually in affirmative sentences.'],['ANY','Usually in questions and negatives.','Do we have any eggs? · We don’t have any cheese.','Works with plural and uncountable nouns.']],tip:'Some is also used in offers and requests: “Would you like some water?” A whole cake = a cake; an unspecified amount of cake = some cake.',tasks:[{name:'A. Write a, an, or some + a food or drink word.',example:'Example: some bread',items:[['1. 🥛 Milk (a quantity)','some milk',['a milk','some milk','an milk']],['2. 🥪 Sandwich','a sandwich',['some sandwich','an sandwich','a sandwich']],['3. 🍝 Pasta','some pasta',['some pasta','a pasta','an pasta']],['4. 🥬 Lettuce (leaves)','some lettuce',['an lettuce','some lettuce','a lettuce']],['5. 🥚 Egg','an egg',['a egg','some egg','an egg']],['6. 🥕 Carrots','some carrots',['a carrots','some carrots','an carrots']],['7. 🍫 Chocolate (as food)','some chocolate',['some chocolate','a chocolate','an chocolate']],['8. 🎂 Whole cake','a cake',['some cake','a cake','an cake']]]},{name:'B. Complete the conversation with a, an, some, or any.',example:'A: What can we cook for your brother and his girlfriend? B: Let’s make a pizza.',items:[['1. Are there ___ tomatoes?','any'],['2. There are ___ mushrooms, too.','some'],['3. There isn’t ___ cheese!','any'],['4. I bought ___ steak yesterday.','some'],['5. Are there ___ potatoes?','any'],['6. Do we have ___ fruit?','any'],['7. We have ___ oranges.','some'],['8. There’s ___ apple.','an'],['9. And ___ bananas, too.','some'],['10. You can make ___ fruit salad for dessert.','a']]}]},{id:'b',title:'9B · HOW MUCH, HOW MANY & QUANTIFIERS',sub:'Talking about quantities',cards:[['HOW MUCH','For uncountable nouns.','How much water? · How much rice?','Water, milk, rice, sugar, cheese.'],['HOW MANY','For plural countable nouns.','How many eggs? · How many bottles?','Eggs, biscuits, bottles, apples.'],['A LOT OF','A large quantity; both noun types.','a lot of apples · a lot of coffee','Use before a noun.'],['MUCH / MANY','Often in questions and negatives.','not much milk · not many eggs','Much = uncountable; many = countable.'],['A LITTLE / A FEW','A small quantity.','a little sugar · a few biscuits','Little = uncountable; few = countable.'],['QUITE A LOT / NONE','Quite a lot = bastante; none = ninguno / nada.','I bought quite a lot of fruit. · How many? None.','Quite a lot OF + noun; quite a lot on its own.'],['LOTS OF','Another way to say a large quantity.','lots of books 📚 · lots of water 💧','Like a lot of, works with countable and uncountable nouns.'],['NO / NONE','NO goes before a noun; NONE stands alone.','There is no milk. · How much milk? None.','Do not say “none milk”.'],['ENOUGH','The quantity is sufficient.','We have enough water. · There are enough chairs.','Use enough before a noun.']],tip:'Compare: “How much water?” but “How many bottles of water?”',tasks:[{name:'A. Complete with How much or How many.',example:'Example: How much sugar do you put in your tea?',items:[['1. ___ butter do you use for this cake?','How much'],['2. ___ cans of Coke did she drink?','How many'],['3. ___ oil do I need?','How much'],['4. ___ chocolates were in that box?','How many'],['5. ___ rice do you want?','How much'],['6. ___ coffee does he drink?','How much'],['7. ___ bottles of water did you buy?','How many'],['8. ___ tins of tuna do we have?','How many'],['9. ___ orange juice is there in that carton?','How much'],['10. ___ biscuits did you eat?','How many']]},{name:'B. Choose the correct word or phrase.',example:'Example: I don’t put much / many salt on my food.',items:[['1. We don’t eat ___ sweets.','a lot of',['a lot','a lot of']],['2. A: How much chocolate do you eat? B: ___.','A little',['A little','A few']],['3. My husband doesn’t drink ___ coffee.','much',['much','many']],['4. A: How much fruit did you buy? B: ___.','Quite a lot',['Quite a lot','Quite a lot of']],['5. We eat ___ fish. We love it!','a lot of',['a lot of','much']],['6. A: Do your children drink any milk? B: No, ___.','not much',['not much','not many']],['7. Donna ate her hamburger, but she didn’t eat ___ chips.','many',['much','many']],['8. A: How many vegetables do you eat? B: ___. I don’t like them.','None',['Any','None']],['9. I have a cup of tea and ___ cereal for breakfast.','a little',['a few','a little']],['10a. A: Do you eat ___ meat?','much',['much','many']],['10b. B: No, I don’t eat ___ meat. I’m a vegetarian.','any',['no','any']]]}]},{id:'c',title:'9C · COMPARATIVES',sub:'Comparing two people, places or things',cards:[['SHORT ADJECTIVES','Add -er.','tall → taller · cheap → cheaper','This shop is cheaper than that one.'],['ENDING IN -E','Add -r.','nice → nicer · late → later',''],['ENDING IN -Y','Change -y to -ier (after a consonant).','happy → happier · easy → easier',''],['DOUBLE CONSONANT','For some short adjectives: double the final consonant.','big → bigger · wet → wetter',''],['LONG ADJECTIVES','Use more + adjective.','more interesting · more comfortable',''],['IRREGULAR','These forms change.','good → better · bad → worse · far → farther / further','']],tip:'Pattern: <b>A + be + comparative + than + B</b>. Example: “This exercise is easier than the last one.”',tasks:[{name:'A. Write the comparative form.',example:'Example: big → bigger',items:[['1. high → ___','higher'],['2. dirty → ___','dirtier'],['3. important → ___','more important'],['4. late → ___','later'],['5. low → ___','lower'],['6. bored → ___','more bored'],['7. wet → ___','wetter'],['8. modern → ___','more modern'],['9. comfortable → ___','more comfortable'],['10. happy → ___','happier']]},{name:'B. Complete with a comparative adjective + than.',example:'Example: My sister is younger than me. She’s only 18. (young)',items:[['1. The market is ___ the supermarket for vegetables. (cheap)','cheaper than'],['2. Italian is ___ for Spanish people than it is for English people. (easy)','easier'],['3. I always feel ___ in the afternoon than in the morning. (tired)','more tired'],['4. This restaurant is ___ when it first opened. (busy)','busier than'],['5. Come in the summer. The weather is ___ in the spring. (good)','better than'],['6. I love science. I find it ___ history. (interesting)','more interesting than'],['7. Milan is ___ from the sea than Rome. (far)','farther',['farther','further','the farthest']],['8. I’m ___ my brother. He’s very tall. (short)','shorter than'],['9. The economic situation is ___ it was last year. (bad)','worse than'],['10. Skiing is ___ I thought it was. (difficult)','more difficult than'] ]}]},
{id:'d',title:'9D · AS…AS / NOT AS…AS',sub:'Comparing things that are equal or different',cards:[
['AS + ADJECTIVE + AS','Two things are equal.','My bag is as heavy as yours.','Tan…como. The adjective stays in its basic form.'],
['NOT AS + ADJECTIVE + AS','One thing is less than the other.','This test isn’t as difficult as the last one.','No tan…como.'],
['Comparative or AS…AS?','Different: cheaper than. Equal: as cheap as.','Ana is as tall as Leo. · Ana is taller than Leo.','Do not say “as taller as”.']
],tip:'Pattern: subject + be + (not) as + adjective + as + comparison. Use the adjective without -er or more.',tasks:[
{name:'A. Choose the correct expression.',example:'Example: This book is as interesting as that one.',items:[
['1. My sister is ___ me. We are both 1.70 m tall.','as tall as',['as tall as','taller as','as taller than']],
['2. This film isn’t ___ the book.','as good as',['as good as','better as','as better than']],
['3. My phone is ___ yours. They cost the same.','as expensive as',['as expensive as','more expensive as','expensiver than']],
['4. Today isn’t ___ yesterday. It is warmer.','as cold as',['as cold as','colder as','as colder than']],
['5. My English class is ___ my maths class. Both are fun.','as interesting as',['as interesting as','more interesting as','as interestinger as']],
['6. This café isn’t ___ the restaurant. The café is quieter.','as noisy as',['as noisy as','noisier as','as noisier than']],
['7. I am ___ my friend. We are both 20.','as old as',['as old as','older as','as older than']],
['8. The blue dress isn’t ___ the red one. It costs less.','as expensive as',['as expensive as','more expensive as','expensiver as']]
]},
{name:'B. Complete the mini-dialogues.',example:'Choose the expression that best completes each sentence.',items:[
['1. A: Is the train as fast as the plane? B: No, it’s ___ the plane.','not as fast as',['not as fast as','as faster as','faster as']],
['2. A: Are these shoes the same size? B: Yes, the black ones are ___ the white ones.','as big as',['as big as','bigger as','as bigger than']],
['3. A: Is the second exercise easier? B: No, it’s ___ the first one. They’re equally difficult.','as difficult as',['as difficult as','more difficult as','as difficult than']],
['4. A: Is your bedroom as large as mine? B: No, mine is ___ yours.','not as large as',['not as large as','as larger as','larger as']],
['5. A: Are both restaurants good? B: Yes, this one is ___ that one.','as good as',['as good as','better as','as better than']],
['6. A: Does your brother run as quickly as you? B: No, he doesn’t run ___.','as quickly as I do',['as quickly as I do','as quicker as I do','quicker as I do']]
]}]},
{id:'e',title:'9E · SUPERLATIVES',sub:'The biggest, the most interesting, the best…',cards:[
['SHORT ADJECTIVES','THE + adjective + -EST','small → the smallest · tall → the tallest','nice → the nicest · big → the biggest'],
['-Y → -IEST','Consonant + y changes to -iest.','happy → the happiest · easy → the easiest','busy → the busiest'],
['LONG ADJECTIVES','THE MOST + adjective','the most expensive · the most interesting','Do not say “the most cheapest”.'],
['IRREGULAR','Special forms.','good → the best · bad → the worst','far → the farthest / the furthest']
],tip:'Comparative: two things → “bigger than”. Superlative: one stands out in a group → “the biggest in the class”. Use IN for places/groups and OF for sets: the tallest in the class; the best of the three.',tasks:[
{name:'A. Choose the correct superlative form.',example:'Example: big → the biggest',items:[
['1. high → ___','the highest',['the highest','the most high','the higher']],
['2. dirty → ___','the dirtiest',['the dirtyest','the dirtiest','the most dirty']],
['3. important → ___','the most important',['the importantest','the most important','the more important']],
['4. late → ___','the latest',['the latest','the lateest','the most late']],
['5. low → ___','the lowest',['the lowest','the lower','the most low']],
['6. wet → ___','the wettest',['the wettest','the wetest','the most wet']],
['7. comfortable → ___','the most comfortable',['the comfortablest','the more comfortable','the most comfortable']],
['8. happy → ___','the happiest',['the happiest','the happyest','the most happy']],
['9. good → ___','the best',['the goodest','the best','the better']],
['10. bad → ___','the worst',['the baddest','the worse','the worst']]
]},
{name:'B. Complete the sentences.',example:'Choose the best answer for each sentence.',items:[
['1. This is ___ restaurant in our town. (good)','the best',['the best','the better','the most good']],
['2. August is usually ___ month here. (cold)','the coldest',['the colder','the coldest','the most cold']],
['3. That was ___ exam of the year. (difficult)','the most difficult',['the difficulter','the most difficult','the more difficult']],
['4. Who is ___ person in your family? (old)','the oldest',['the older','the most old','the oldest']],
['5. This is ___ film I’ve ever seen. (funny)','the funniest',['the funnyest','the funniest','the most funny']],
['6. The blue bag is ___ of the three. (cheap)','the cheapest',['the cheaper','the cheapest','the most cheap']],
['7. She is ___ student in the class. (hard-working)','the most hard-working',['the hardest-working than','the most hard-working','the more hard-working']],
['8. This is ___ day of my life! (bad)','the worst',['the worse','the baddest','the worst']],
['9. Which is ___ city in your country? (big)','the biggest',['the biggest','the bigger','the most big']],
['10. This is ___ chair in the office. (comfortable)','the most comfortable',['the comfortablest','the more comfortable','the most comfortable']]
]},
{name:'C. Final review: comparative, equality or superlative?',example:'Choose the form that matches the meaning.',items:[
['1. My bike is ___ yours. Mine is faster.','faster than',['faster than','as fast as','the fastest']],
['2. Both laptops are equally light. This one is ___ that one.','as light as',['lighter than','as light as','the lightest']],
['3. This is ___ book in the library. No other book is longer.','the longest',['longer than','as long as','the longest']],
['4. My coffee isn’t ___ yours. Yours is hotter.','as hot as',['as hot as','hotter than','the hottest']],
['5. Of all my friends, Sara is ___.','the youngest',['younger than','as young as','the youngest']],
['6. This exercise is ___ the previous one. This one is harder.','more difficult than',['as difficult as','more difficult than','the most difficult']],
['7. Both houses have the same price. This house is ___ that one.','as expensive as',['more expensive than','the most expensive','as expensive as']],
['8. January is ___ month of the year here. No other month is hotter.','the hottest',['hotter than','as hot as','the hottest']],
['9. I’m ___ my brother. We are the same height.','as tall as',['as tall as','taller than','the tallest']],
['10. This restaurant is ___ the one next door. Its food is better.','better than',['the best','as good as','better than']]
]}]}];
function choices(answer,opts){if(opts)return opts;let sets={'easier':['easier','more easy','easyer'],'more tired':['more tired','tireder','tiredest'],'a':['a','an','some','any'],'an':['a','an','some','any'],'some':['a','an','some','any'],'any':['a','an','some','any'],'How much':['How much','How many'],'How many':['How much','How many']};if(sets[answer])return sets[answer];let extra={'higher':['higher','highier','more high'],'dirtier':['dirtyer','dirtier','more dirty'],'more important':['importanter','more important','importantier'],'later':['later','lateer','more late'],'lower':['lower','lowwer','more low'],'more bored':['boreder','more bored','boredder'],'wetter':['weter','wetter','more wet'],'more modern':['moderner','more modern','modernest'],'more comfortable':['comfortabler','more comfortable','comfortablier'],'happier':['happyer','happier','more happy']};if(extra[answer])return extra[answer];return [answer,answer.replace(' than',''),answer.startsWith('more ')?answer.slice(5):'more '+answer]}
function iconFor(label){const icons={'A / AN':'🍎 🥪','SOME':'🥛 🍪','ANY':'🍌 ❔','HOW MUCH':'🥛 💧','HOW MANY':'🥚 🍎','A LOT OF':'🍎 🍎 🍎','MUCH / MANY':'🥤 ✏️','A LITTLE / A FEW':'🥛 🍏','QUITE A LOT / NONE':'📦 0️⃣','LOTS OF':'📚 📚','NO / NONE':'🚫 🥛','ENOUGH':'🥛 🪑','SHORT ADJECTIVES':'📏','ENDING IN -E':'✨','ENDING IN -Y':'😊','DOUBLE CONSONANT':'🌡️','LONG ADJECTIVES':'📚','IRREGULAR':'⭐','AS + ADJECTIVE + AS':'⚖️','NOT AS + ADJECTIVE + AS':'↔️','Comparative or AS…AS?':'🔍','-Y → -IEST':'🏆'};return icons[label]||'🏅'}
function render(){document.getElementById('content').innerHTML=units.map(u=>`<section class="unit u9${u.id}" id="${u.id}"><div class="unit-head"><h2>${u.title}</h2><p>${u.sub}</p></div><div class="inner"><div class="cards">${u.cards.map(c=>`<div class="card"><h3>${c[0]}</h3><div class="card-picture" aria-hidden="true">${iconFor(c[0])}</div><p class="rule">${c[1]}</p><p class="eg">${c[2]}</p>${c[3]?`<p class="note">${c[3]}</p>`:''}</div>`).join('')}</div><div class="tip">💡 ${u.tip}</div><div class="practice"><h3>✏️ Practice</h3>${u.tasks.map((t,ti)=>`<div class="task"><h4>${t.name}</h4><p class="example">${t.example}</p>${t.items.map((it,i)=>{let ans=it[1],opts=choices(ans,it[2]);return `<div class="question" data-answer="${encodeURIComponent(ans)}" data-alt="${encodeURIComponent(JSON.stringify(it[2]||[]))}"><label>${it[0].replaceAll('___','<strong>_____</strong>')}</label><select aria-label="Answer for question ${i+1}"><option value="">Choose an answer…</option>${opts.map(o=>`<option value="${o}">${o.replaceAll('|',' … ')}</option>`).join('')}</select><div class="feedback" aria-live="polite"></div></div>`}).join('')}</div>`).join('')}<div class="buttons"><button class="btn" onclick="check('${u.id}')">Check answers</button><button class="btn secondary" onclick="resetUnit('${u.id}')">Try again</button></div><div class="score" id="score-${u.id}" aria-live="polite"></div></div></div></section>`).join('')}
function check(id){let q=[...document.querySelectorAll(`#${id} .question`)],ok=0,answered=0;q.forEach(x=>{let ans=decodeURIComponent(x.dataset.answer),v=x.querySelector('select').value,alts=JSON.parse(decodeURIComponent(x.dataset.alt));x.classList.remove('correct','incorrect');if(v)answered++;let valid=v===ans|| (ans==='farther'&&v==='further');if(v&&valid){ok++;x.classList.add('correct');x.querySelector('.feedback').textContent='✓ Correct'}else if(v){x.classList.add('incorrect');x.querySelector('.feedback').textContent='Try again'}else{x.querySelector('.feedback').textContent=''}});document.getElementById(`score-${id}`).textContent=`${ok} correct out of ${q.length} · ${q.length-answered} unanswered`}
function resetUnit(id){document.querySelectorAll(`#${id} .question`).forEach(x=>{x.querySelector('select').value='';x.classList.remove('correct','incorrect');x.querySelector('.feedback').textContent=''});document.getElementById(`score-${id}`).textContent=''}render();
</script></body></html>
